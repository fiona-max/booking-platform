<div class="traveler-selector position-relative">
  <button class="w-100 border-0 bg-transparent text-start d-flex align-items-center gap-2 p-0 text-custom-dark"
          (click)="isOpen = !isOpen" type="button">
    <span class="fw-bold text-sm">{{ totalTravelers }} {{ totalTravelers === 1 ? 'Traveler' : 'Travelers' }}</span>
  </button>

  <!-- Dropdown Content -->
  <div class="dropdown-menu shadow-lg p-3 card-custom border"
       [class.show]="isOpen"
       style="width: 320px; position: absolute; top: 100%; left: 0; z-index: 1050;">

    <div class="d-flex justify-content-between align-items-center mb-3 text-custom-dark">
      <h6 class="mb-0 fw-semibold">Travelers</h6>
    </div>

    <!-- Adults -->
    <div class="d-flex justify-content-between align-items-center mb-3 text-custom-dark">
      <div>
        <div class="fw-medium">Adults</div>
        <small class="text-custom-muted">Aged 18+ years</small>
      </div>
      <div class="input-group" style="width: 120px;">
        <button type="button" class="btn btn-outline-primary py-0" (click)="decrement('adults')">-</button>
        <input type="text" class="form-control text-center fw-bold bg-transparent text-custom-dark" [value]="adults" readonly>
        <button type="button" class="btn btn-outline-primary py-0" (click)="increment('adults')">+</button>
      </div>
    </div>

    <!-- Infants -->
    <div class="d-flex justify-content-between align-items-center mb-4 text-custom-dark">
      <div>
        <div class="fw-medium">Children</div>
        <small class="text-custom-muted">Aged 0 to 17 years</small>
      </div>
      <div class="input-group" style="width: 120px;">
        <button type="button" class="btn btn-outline-primary py-0" (click)="decrement('children')">-</button>
        <input type="text" class="form-control text-center fw-bold bg-transparent text-custom-dark" [value]="children" readonly>
        <button type="button" class="btn btn-outline-primary py-0" (click)="increment('children')">+</button>
      </div>
    </div>

    <!-- Done Button -->
    <button type="button" class="btn btn-primary-custom w-100 fw-semibold"
            (click)="done()">
      Done | {{ totalTravelers }} {{ totalTravelers === 1 ? 'Traveler' : 'Travelers' }}
    </button>
  </div>
</div>
