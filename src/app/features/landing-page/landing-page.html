<!-- Hero & Search Section -->
<section
  class="position-relative py-5 bg-img-cover d-flex align-items-center justify-content-center text-center"
  style='background-image: linear-gradient(rgba(255,255,255,0.7), rgba(255,255,255,0.7)), url("https://lh3.googleusercontent.com/aida-public/AB6AXuD2SGLlrun8riu4delUewMf091VMJrSnxhvk8EzsY8-CqMc5wsd5FrBRbY_p90xwD-x0E5D-sUcypaVbbaBvc7Nz0QVgkNa5d2lCpdqGo24HcmSdyaDvA5zuq6jSWgZFteq7AuhFDzXqlmjh70rf6iD4r6J7s6mBqFBd_2r43zBL1W8x-kSJqnTvaEOjTGgrKGaTvrUw8R-WG_DBm6-Npi_l3irikR2Ra-6uwPi1oRNaHIgTQ2BVpIIS7uAsugk3jS2Yim0GdZxobo"); min-height: 60vh;'
>

  <div class="container text-custom-dark">

    <h2 class="display-4 fw-black mb-3 text-custom-dark">
      {{ 'LANDING.HERO_TITLE' | translate }}
    </h2>

    <p class="fs-5 mb-5 mx-auto font-medium text-custom-dark opacity-75" style="max-width: 700px;">
      {{ 'LANDING.HERO_SUBTITLE' | translate }}
    </p>

    <!-- FORM -->
    <div class="mt-4 d-flex justify-content-center">
      <app-flight-search-form></app-flight-search-form>
    </div>

  </div>

</section>
<section class="py-2 bg-light-custom">
  <div class="container py-2">

    <!-- Header -->
    <div class="text-center">
      <h2 class="h2 text-secondary-custom mb-2">
        {{ 'LANDING.ADVANTAGE_TITLE' | translate }}
      </h2>
      <div class="bg-brandGold mx-auto rounded-pill" style="width: 80px; height: 4px;"></div>
    </div>

    <!-- Features -->
    <div class="row g-5">
      <div *ngFor="let feature of features"
           class="col-12 col-md-4 text-center">
        <div class="p-4 rounded-4 transition-all hover-bg-light">

          <!-- Icon -->
          <div class="d-flex align-items-center justify-content-center mx-auto mb-4 bg-light-custom text-primary-custom rounded-4 transition-all hover-scale"
               style="width: 64px; height: 64px;">

            <!-- Shield -->
            <svg *ngIf="feature.icon === 'shield'"
                 class="text-brandTeal"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 32px; height: 32px;">
              <path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>

            <!-- Clock -->
            <svg *ngIf="feature.icon === 'clock'"
                 class="text-brandTeal"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 32px; height: 32px;">
              <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>

            <!-- Lock -->
            <svg *ngIf="feature.icon === 'lock'"
                 class="text-brandTeal"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 32px; height: 32px;">
              <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>

          </div>

          <!-- Content -->
          <h3 class="h5 fw-bold mb-3 text-custom-dark">
            {{ feature.title | translate }}
          </h3>

          <p class="text-custom-muted lh-base">
            {{ feature.description | translate }}
          </p>
        </div>
      </div>

    </div>
  </div>
</section>
