  <div class="row mt-5">

    <!-- LEFT -->
    <div class="col-lg-8">

      <div class="card-soft">

        <div class="d-flex justify-content-between align-items-center mb-4">
          <h5 class="section-title">Traveler Information</h5>
          <small class="text-muted">Step 1 of 1</small>
        </div>

        <div class="row">

          <div class="col-md-6 mb-3">
            <label class="form-label small text-uppercase">First Name</label>
            <input class="input-custom" placeholder="As on passport" />
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label small text-uppercase">Last Name</label>
            <input class="input-custom" />
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label small text-uppercase">Date of Birth</label>
            <input type="date" class="input-custom" />
          </div>

          <div class="col-md-3 mb-3">
            <label class="form-label small text-uppercase">Gender</label>
            <select class="input-custom">
              <option>Male</option>
              <option>Female</option>
            </select>
          </div>

          <div class="col-md-3 mb-3">
            <label class="form-label small text-uppercase">Nationality</label>
            <input class="input-custom" />
          </div>

        </div>
      </div>

<!--      <app-contact-form class="mt-4"></app-contact-form>-->
      <div class="card-soft">

        <h5 class="section-title mb-4">Contact Details</h5>

        <form [formGroup]="UserDetailsform">

          <div class="row">

            <div class="col-md-6 mb-3">
              <label class="form-label small text-uppercase">Email</label>
              <input type="email" class="input-custom" formControlName="email" />
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label small text-uppercase">Phone</label>
              <input type="tel" class="input-custom" formControlName="phone" />
            </div>

            <div class="col-12 mt-3 p-4 rounded bg-light">
              <h6 class="text-uppercase small mb-3">Emergency Contact</h6>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <input class="input-custom" placeholder="Full Name" formControlName="emergencyName" />
                </div>

                <div class="col-md-6 mb-3">
                  <input class="input-custom" placeholder="Phone" formControlName="emergencyPhone" />
                </div>
              </div>
            </div>

          </div>

        </form>

      </div>
